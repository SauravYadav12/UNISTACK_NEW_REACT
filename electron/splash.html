<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unistack — Loading</title>
  <!-- Orbitron — same font the auth screen uses for the wordmark. Loaded
       from Google Fonts so the splash matches the brand exactly. We
       request a single weight (800) to keep the network blip tiny. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap"
  />
  <style>
    /* Reset + transparent base so the rounded card "floats" above the
       desktop. The frameless BrowserWindow has transparent:true, which
       passes through the body's transparent background. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none;
      cursor: default;
    }

    /* The card itself — fills the splash window, has rounded corners,
       and hosts every animated layer below. */
    .card {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      /* Same brand gradient the auth hero uses (tokens.colors.brand
         resolves to the deep navy; pink/blue/yellow orbs sit on top). */
      background:
        radial-gradient(circle at 15% 25%, rgba(236, 69, 153, 0.32) 0%, transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(55, 183, 234, 0.28) 0%, transparent 55%),
        radial-gradient(circle at 50% 105%, rgba(252, 228, 65, 0.20) 0%, transparent 50%),
        linear-gradient(135deg, #032840 0%, #0A3555 50%, #032840 100%);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: card-in 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes card-in {
      0%   { opacity: 0; transform: scale(0.94); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Floating "orbs" — same brand vibe as the auth hero. Pure CSS,
       no JS frame loop. */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }
    .orb.a { width: 360px; height: 360px; top: 8%; left: 4%;
             background: radial-gradient(circle, rgba(236, 69, 153, 0.28) 0%, transparent 70%);
             animation: float1 9s ease-in-out infinite; }
    .orb.b { width: 320px; height: 320px; bottom: 8%; right: 6%;
             background: radial-gradient(circle, rgba(55, 183, 234, 0.22) 0%, transparent 70%);
             animation: float2 11s ease-in-out infinite; }
    .orb.c { width: 220px; height: 220px; top: 50%; left: 42%;
             background: radial-gradient(circle, rgba(252, 228, 65, 0.18) 0%, transparent 70%);
             animation: float3 7s ease-in-out infinite; }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(40px, -25px) scale(1.05); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-30px, 35px) scale(1.1); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(20px, 18px); }
    }

    /* Subtle starfield — mirrors the auth hero so the splash feels
       contiguous with the next screen. */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 18% 32%, rgba(255, 255, 255, 0.4) 0.5px, transparent 1px),
        radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.5) 0.5px, transparent 1px),
        radial-gradient(circle at 48% 78%, rgba(255, 255, 255, 0.3) 0.5px, transparent 1px),
        radial-gradient(circle at 88% 62%, rgba(255, 255, 255, 0.4) 0.5px, transparent 1px),
        radial-gradient(circle at 22% 82%, rgba(255, 255, 255, 0.3) 0.5px, transparent 1px);
      opacity: 0.6;
      pointer-events: none;
    }

    /* The hero stack — eyebrow, wordmark, tagline, dots. Mirrors the
       auth hero's vertical rhythm. */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: hero-in 700ms 100ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes hero-in {
      0%   { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* "SYSTEM ONLINE · AWAITING CREDENTIALS" eyebrow pill — glass
       background, pulsing pink dot on the left. */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }
    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EC4599;
      box-shadow: 0 0 10px #EC4599;
      animation: pulseBeat 1.6s ease-in-out infinite;
    }
    @keyframes pulseBeat {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.6; transform: scale(1.25); }
    }
    .eyebrow .label {
      font-size: 11px;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
    }

    /* Big wordmark: UNI [logo] TACK in Orbitron 800 white, with the
       logo image floating gently as the "S". Matches AuthLayout's
       BrandMark size="lg". */
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
    }
    .wordmark .letters {
      font-family: "Orbitron", "Inter", sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      line-height: 1;
    }
    .wordmark .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
      animation: bob 3.5s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    /* Tagline — matches the auth hero's copy block. */
    .tagline {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      line-height: 1.6;
      max-width: 420px;
      text-align: center;
      margin: 0;
    }

    /* Three pulse dots — brand colors, staggered so they ripple in
       sequence. Identical pattern to the auth hero. */
    .dots {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }
    .dots .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: dotPulse 2.4s ease-in-out infinite;
    }
    .dots .pulse:nth-child(1) {
      background: #EC4599;
      box-shadow: 0 0 14px #EC4599;
      animation-delay: 0s;
    }
    .dots .pulse:nth-child(2) {
      background: #37B7EA;
      box-shadow: 0 0 14px #37B7EA;
      animation-delay: 0.25s;
    }
    .dots .pulse:nth-child(3) {
      background: #FCE441;
      box-shadow: 0 0 14px #FCE441;
      animation-delay: 0.5s;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }

    /* Smooth fade-out when main.ts decides to close us. Triggered by
       toggling the [data-leaving] attribute on <body>. */
    body[data-leaving="true"] .card {
      animation: card-out 380ms cubic-bezier(0.4, 0, 1, 1) both;
    }
    @keyframes card-out {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.96); }
    }
  </style>
</head>
<body>
  <div class="card" role="presentation" aria-hidden="true">
    <span class="orb a"></span>
    <span class="orb b"></span>
    <span class="orb c"></span>
    <span class="stars"></span>

    <div class="hero">
      <!-- "SYSTEM ONLINE · AWAITING CREDENTIALS" eyebrow -->
      <div class="eyebrow">
        <span class="dot"></span>
        <span class="label">System online</span>
      </div>

      <!-- UNI [logo] TACK — same layout the auth hero uses -->
      <div class="wordmark">
        <span class="letters">UNI</span>
        <img class="logo" src="assets/logo-splash.png" alt="S" />
        <span class="letters">TACK</span>
      </div>

      <!-- Tagline -->
      <p class="tagline">Welcome to the command center</p>

      <!-- Brand color dots -->
      <div class="dots">
        <span class="pulse"></span>
        <span class="pulse"></span>
        <span class="pulse"></span>
      </div>
    </div>
  </div>

  <script>
    // main.ts triggers the fade-out by setting body[data-leaving="true"].
    window.__leave = () => document.body.setAttribute("data-leaving", "true");
  </script>
</body>
</html>
