# Electron builder config — produces installable Windows + macOS binaries.
# Run via `npm run build:electron-mac` / `build:electron-win`.
#
# Notes:
#   - "files" lists what goes into the asar archive. We bundle the
#     compiled main + preload + assets. The renderer is the LIVE web
#     URL (loaded over HTTPS), so we do NOT bundle src/ or dist/.
#   - macOS universal target produces a single .dmg that runs on both
#     Intel and Apple Silicon — half the file size of shipping two .dmgs.
#   - No code-signing for v1 — users right-click → Open (mac) or click
#     "More info → Run anyway" (win) the first time. We'll add certs in
#     a later release.

appId: com.unicodez.unistack
productName: Unistack
copyright: "Copyright © 2026 Unicodez Softcorp"

# We DON'T need npm rebuild — there are no native modules in the main
# process (electron's IPC + tray + Notification are all built-in).
# Skipping the rebuild step also lets us cross-compile Windows from
# macOS: without `npmRebuild: false`, electron-builder tries to rebuild
# transitive native deps like `canvas` and `fsevents` for Windows from
# a Mac, which node-gyp can't do.
buildDependenciesFromSource: false
npmRebuild: false

directories:
  output: dist-electron
  buildResources: electron/assets

# Explicit allow-list of what goes into the asar archive. ANYTHING not
# matched here is excluded — node_modules, src/, dist/, README files
# etc. all stay out. For a thin-shell Electron app loading a remote
# URL, the only runtime requirements are:
#   - Compiled main process + preload (electron/dist/*.js)
#   - Splash HTML + assets
#   - package.json (Electron reads "main" + "name" from here)
#   - electron/package.json (forces CommonJS resolution for dist/*.js)
files:
  - electron/dist/**/*.js
  - electron/splash.html
  - electron/assets/**/*
  - electron/package.json
  - "package.json"

# Compress the asar harder. Trades CPU at build time for a smaller
# on-disk footprint and a slightly slower startup decompression — but
# the splash window covers cold-start anyway, so it's net win.
compression: maximum
# Keep asar packing enabled (default). Setting asar: false would bloat
# the installer by 30-40% with uncompressed files.
asarUnpack: []

mac:
  category: public.app-category.productivity
  # Universal binary — single DMG that runs on both Intel and Apple
  # Silicon. Larger than single-arch (~300 MB vs ~150 MB) but avoids
  # forcing users to know their CPU architecture. Acceptable trade-off
  # for an internal tool with a mixed fleet.
  #
  # If you want to halve the Mac download size later, swap this for:
  #   target:
  #     - target: dmg
  #       arch: [arm64]   # Apple Silicon only (M1/M2/M3, post-2020 Macs)
  # — but you'll need to update the /download modal to surface arch
  # selection and update release-desktop.sh to upload both files.
  target:
    - target: dmg
      arch:
        - universal
  # ZIP target removed — DMG is the canonical install medium on macOS
  # and the ZIP just doubles output size for no gain.
  icon: electron/assets/icon.png
  # Strip the default "-universal" suffix from artifact filenames so
  # the release script can predict the output path.
  artifactName: ${productName}-${version}.${ext}
  # No notarization / signing for v1. Add later:
  #   identity: "Developer ID Application: Unicodez Softcorp (TEAMID)"
  #   notarize: { teamId: "TEAMID" }
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64
  # Same story as mac — electron-builder generates .ico from the PNG.
  icon: electron/assets/icon.png
  # No code-signing for v1. SmartScreen will warn on first launch.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Unistack
